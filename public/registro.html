<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Node.js</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container amplio">
        <h2>Crear una cuenta</h2>
        <p class="subtitulo">Regístrate para empezar</p>
        
        <form id="formRegistro">
            <div class="fila-doble">
                <input type="text" id="inputNombre" name="nombre" placeholder="Nombre" required>
                <input type="text" id="inputApellido" name="apellido" placeholder="Apellido" required>
            </div>
            <div class="grupo-input">
                <input type="text" id="inputUsuario" name="usuario" placeholder="Nombre de usuario" required>
                <small id="feedbackUsuario" class="feedback"></small>
            </div>
            <div class="grupo-input">
                <input type="email" id="inputEmail" name="email" placeholder="Correo electrónico" required>
                <small id="feedbackEmail" class="feedback"></small>
            </div>
            <input type="text" id="inputTelefono" name="telefono" placeholder="Teléfono (Opcional)">
            <input type="password" id="inputPassword" name="password" placeholder="Contraseña segura" required>
            
            <button type="submit" id="btnRegistrar">Registrarme</button>
        </form>
        
        <div id="mensajeRegistro" class="mensaje"></div>
        <p class="enlace-cambio">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
